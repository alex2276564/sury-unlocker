rules:
  disable:
    GHA_TAG_NOT_SHA: "Exclude mutable action tag rule because supply-chain-guard does not support the modern actions.lockfile mechanism yet."
    GHA_THIRD_PARTY_ACTION: "Third-party actions are acceptable for this project."

suppress:
  - rule: WORKFLOW_SECRET_TO_UPLOAD_PATH
    reason: "Secrets are already scoped to the minimum set of steps; outbound calls are limited to trusted endpoints."
    path: .github/workflows/scheduled-security.yml
  - rule: WORKFLOW_SECRET_TO_UPLOAD_PATH
    reason: "Secrets are already scoped to the minimum set of steps; outbound calls are limited to trusted endpoints."
    path: .github/workflows/ci.yml
